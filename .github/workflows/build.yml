name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Preparar core y librerias
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install LiquidCrystal

      - name: Comprobar que el sketch es valido
        run: |
          echo "Carpeta del sketch: $(basename $PWD)"
          echo "Archivos .ino encontrados:"
          ls -1 *.ino
          echo "El nombre del .ino DEBE coincidir con el de la carpeta."

      - name: Compilar
        run: arduino-cli compile --fqbn arduino:avr:uno --warnings all .
